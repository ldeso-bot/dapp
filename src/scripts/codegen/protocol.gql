query getCarbonClasses($where: CarbonClass_filter) {
  carbonClasses(where: $where, first: 1000) {
    priceUsdcPerTon {
      priceUsdc
    }
    id
    carbonClassId
    isRegistered
    registeredCredits(first: 1000) {
      creditTokenId
    }
  }
}

query getTokens {
  tokens(first: 1000) {
    ...TokenFragment
  }
}

query getTokenSnapshots($where: TokenSnapshot_filter) {
  tokenSnapshots(
    where: $where
    orderBy: hoursSinceEpoch
    orderDirection: desc
    first: 1
  ) {
    hoursSinceEpoch
    tokenAddress
    priceUsdc
    symbol
    supply
    totalAmountLocked
    totalAmountAllocated
  }
}

query getMaturityManager {
  maturityManagers(first: 1) {
    firstActiveMaturityId
    lastActiveMaturityId
  }
}

query getMaturities($where: Maturity_filter) {
  maturities(where: $where, orderBy: maturityId, first: 1000) {
    timestamp
    maturityId

    SyntheticYieldDiscountFactor
    SyntheticYieldZeroCouponYieldCurve
    SyntheticYieldUnscaledBondIssue

    RiskyYieldDiscountFactor
    RiskyYieldZeroCouponYieldCurve
    RiskyYieldUnscaledBondIssue
  }
}

query getPrices {
  prices(first: 1000) {
    symbol
    priceUsdc
    tokenAddress
  }
}

query getAllocations($where: Allocation_filter) {
  allocations(where: $where) {
    id
    account {
      id
    }
    carbonClass {
      id
      priceUsdcPerTon {
        priceUsdc
      }
    }
    token {
      symbol
      address
      totalAmountAllocated
    }
    amount
  }
}

query getLocks($where: Lock_filter) {
  locks(where: $where) {
    id
    type
    amount
    account {
      id
    }
    token {
      symbol
      address
      totalAmountLocked
      priceUsdc {
        priceUsdc
      }
    }
  }
}

query getAccountBalances($where: AccountBalance_filter) {
  accountBalances(where: $where) {
    account {
      id
    }
    token {
      symbol
      address
    }
    amount
  }
}
