query getCarbonClasses {
  carbonClasses {
    ...CarbonClassFragment
  }
}

query getTokens {
  tokens {
    ...TokenFragment
  }
}

query getTokenSnapshots($hoursSinceEpoch: BigInt, $symbol: String) {
  tokenSnapshots(
    where: { hoursSinceEpoch_lte: $hoursSinceEpoch, symbol: $symbol }
    orderBy: hoursSinceEpoch
    orderDirection: desc
  ) {
    hoursSinceEpoch
    tokenAddress
    priceUsdc
    symbol
    supply
    totalAmountLocked
    totalAmountAllocated
  }
}

query getMaturityManager {
  maturityManagers {
    id
    firstActiveMaturityId
    lastActiveMaturityId
  }
}

query getYieldBuckets($where: YieldBucket_filter) {
  yieldBuckets(where: $where, orderBy: maturityId) {
    bucketId
    maturityId
    multiplier
    zeroCouponYieldCurve
    discountFactor
    unscaledBondIssue
    maturity {
      timestamp
    }
  }
}

query getPrices {
  prices {
    symbol
    priceUsdc
    address
  }
}
