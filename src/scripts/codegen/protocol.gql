query getCarbonClasses($where: CarbonClass_filter) {
  carbonClasses(where: $where, first: 1000) {
    priceUsdcPerTon {
      priceUsdc
    }
    id
    carbonClassId
    isRegistered
    registeredCredits(first: 1000) {
      creditTokenId
    }
    liquidities {
      credit {
        creditTokenId
      }
      amount
    }
  }
}

query getTokens {
  tokens(first: 1000) {
    ...TokenFragment
  }
}

query getTokenSnapshots($where: TokenSnapshot_filter) {
  tokenSnapshots(
    where: $where
    orderBy: hoursSinceEpoch
    orderDirection: desc
    first: 1
  ) {
    hoursSinceEpoch
    tokenAddress
    priceUsdc
    symbol
    supply
    totalAmountLocked
    totalAmountAllocated
  }
}

query getProtocolState {
  protocolStates(first: 1) {
    protocolStartTimestamp
    maturityPeriod
    systemPauseStatus
    kvcmStakingPauseStatus
    k2StakingPauseStatus
    lpStakingPauseStatus
  }
}

query getMaturities($where: Maturity_filter) {
  maturities(where: $where, orderBy: maturityId, first: 1000) {
    timestamp
    maturityId

    maturityMidnightInfo {
      ...MidnightInfoFragment
    }
  }
}

query getPrices {
  prices(first: 1000) {
    symbol
    priceUsdc
    tokenAddress
  }
}

query getAllocations($where: Allocation_filter) {
  allocations(where: $where) {
    id
    account {
      id
    }
    carbonClass {
      id
      carbonClassId
      priceUsdcPerTon {
        priceUsdc
      }
    }
    token {
      ...TokenFragment
    }
    amount
    lock {
      id
      contractLockId
      maturityId
      maturity {
        timestamp
      }
    }
  }
}

query getLocks($where: Lock_filter) {
  locks(where: $where) {
    id
    contractLockId
    type
    status
    amount
    originalAmount
    maturityId
    maturity {
      timestamp
      maturityMidnightInfo {
        ...MidnightInfoWithPreviousMidnightInfoFragment
      }
    }
    account {
      id
    }
    token {
      ...TokenFragment
    }

    lockActions(orderBy: timestamp, orderDirection: asc, first: 1000) {
      ...LockActionFragment
    }

    k2YieldClaimed
    riskyYieldClaimed

    syntheticYieldClaimed

    requestUnlockTimestamp
    k2SharesAtUnlockRequest
    k2SharesAtClaimed
    k2WindowStartMidnightInfo {
      ...MidnightInfoFragment
    }
    k2WindowEndMidnightInfo {
      ...MidnightInfoFragment
    }
  }
}

query getAccountBalances($where: AccountBalance_filter) {
  accountBalances(where: $where) {
    account {
      id
    }
    token {
      ...TokenFragment
    }
    amount
  }
}

query getLatestMidnightInfo {
  midnightInfos(
    orderBy: midnightIndex
    orderDirection: desc
    first: 41
    where: { keeperUpdated: true }
  ) {
    ...MidnightInfoWithPreviousMidnightInfoFragment
  }
}

query getMidnightInfo($where: MidnightInfo_filter) {
  midnightInfos(where: $where) {
    ...MidnightInfoWithPreviousMidnightInfoFragment
  }
}
